    <style>
        /* ============ HERO ============ */
        .cat-hero { padding: 150px 0 36px; }
        .cat-hero h1 {
            font-size: clamp(2rem, 5.4vw, 4rem);
            font-weight: 900;
            letter-spacing: 1.5px;
            line-height: 1.05;
            text-transform: uppercase;
            max-width: 16ch;
        }

        /* ============ PRZEMIANY ============ */
        .results { padding: 0 0 24px; }
        .results-list { display: grid; gap: 24px; }

        /* Przemiana z opisem: zdjęcie + cel / działania / efekty */
        .story {
            display: grid;
            grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
            border-radius: 24px;
            overflow: hidden;
            background: var(--dark-2);
            border: 1px solid var(--line);
        }
        .story > .ba-slider { aspect-ratio: auto; height: 100%; min-height: 460px; }
        .story.is-text { grid-template-columns: 1fr; }
        .story-body { padding: 40px 44px; display: flex; flex-direction: column; gap: 22px; }
        .story-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
        .story-highlight { font-size: clamp(2.4rem, 4.6vw, 3.4rem); font-weight: 900; line-height: 1; letter-spacing: -1px; }
        .story-meta { color: var(--gray); font-size: 0.88rem; font-weight: 600; }
        .story-block h3 { font-size: 0.72rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--yellow); margin-bottom: 8px; }
        .story-block p, .story-block li { color: var(--gray-light); font-size: 0.95rem; line-height: 1.65; }
        .story-block ul { list-style: none; display: grid; gap: 6px; }
        .story-block li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; }
        .story-block li i { color: var(--yellow); font-size: 0.75rem; margin-top: 6px; }
        .story-video { position: relative; width: 100%; max-width: 240px; aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; background: var(--dark-3); }
        .story-video video { width: 100%; height: 100%; object-fit: cover; }
        .video-play {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            border: 0;
            background: linear-gradient(180deg, rgba(10,10,10,0.1), rgba(10,10,10,0.55));
            cursor: pointer;
        }
        .video-play-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--yellow);
            color: var(--dark);
            font-size: 1.05rem;
            transition: transform var(--transition);
        }
        .video-play:hover .video-play-icon { transform: scale(1.06); }
        .story-video.is-playing .video-play { display: none; }

        /* Same zdjęcia przed/po (bez opisu) */
        .ba-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; align-items: start; }
        .results-list > .ba-grid { margin-top: 8px; }
        .ba-card { background: var(--dark-2); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
        .ba-card[hidden] { display: none; }
        .ba-card-info { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 16px 18px 18px; }
        .ba-card-highlight { font-size: 1.15rem; font-weight: 800; }
        .ba-card-who { font-size: 0.78rem; color: var(--gray); font-weight: 600; text-align: right; }
        .more-btn { justify-self: center; margin-top: 8px; }

        /* Opinie bez zdjęć i bez opisu */
        .quote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .quote-card { display: flex; flex-direction: column; gap: 18px; padding: 28px; background: var(--dark-2); border: 1px solid var(--line); border-radius: 16px; }
        .quote-card-highlight { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.3px; }
        .quote-card blockquote { color: var(--gray-light); line-height: 1.75; font-size: 0.95rem; flex: 1; }
        .quote-card footer { padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.82rem; }
        .quote-card footer strong { display: block; font-weight: 700; }
        .quote-card footer span { color: var(--gray); }

        /* Pusty stan */
        .empty { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 24px; padding: 36px; border-radius: 24px; border: 1px dashed rgba(255,255,255,0.14); }
        .empty-icon { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: var(--dark-2); color: var(--yellow); font-size: 1.3rem; }
        .empty h2 { font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .empty p { color: var(--gray-light); margin-top: 6px; max-width: 52ch; }

        /* ============ CTA (krótkie) ============ */
        .urgent { padding: 40px 0 0; }
        .urgent-inner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 18px 32px;
            padding: 26px 32px;
            border-radius: 20px;
            background: var(--dark-2);
            border: 1px solid var(--line);
        }
        .urgent p { font-size: 1.05rem; font-weight: 600; line-height: 1.5; }
        .urgent p span { display: block; color: var(--gray-light); font-weight: 400; font-size: 0.95rem; }

        /* ============ INNE PRZEMIANY (przewijane w bok) ============ */
        .others { padding: 88px 0 104px; }
        .others-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; }
        .others-head h2 { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
        .others-track {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            margin-top: 24px;
            padding-bottom: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--dark-4) transparent;
        }
        .other {
            flex: 0 0 250px;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            overflow: hidden;
            background: var(--dark-2);
            border: 1px solid var(--line);
            transition: border-color var(--transition);
        }
        .other:hover { border-color: rgba(245,202,0,0.5); }
        .other img { width: 100%; aspect-ratio: 5 / 6; object-fit: cover; background: var(--dark-3); }
        .other-quote { aspect-ratio: 4 / 3; display: flex; align-items: center; padding: 22px; background: var(--dark-3); font-size: 1.6rem; font-weight: 900; line-height: 1.15; }
        .other-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; }
        .other-title { font-weight: 700; line-height: 1.3; }
        .other-link { color: var(--yellow); font-size: 0.8rem; font-weight: 700; }
        .others-all { display: inline-flex; align-items: center; gap: 8px; color: var(--yellow); font-weight: 700; font-size: 0.9rem; white-space: nowrap; }
        .others-all i { transition: transform var(--transition); }
        .others-all:hover i { transform: translateX(4px); }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 1024px) {
            .story { grid-template-columns: 1fr 1fr; }
            .story-body { padding: 32px; }
        }

        @media (max-width: 768px) {
            .cat-hero { padding: 124px 0 24px; }

            .results-list { gap: 16px; }
            .story { grid-template-columns: 1fr; border-radius: 20px; }
            .story > .ba-slider { aspect-ratio: 5 / 6; min-height: 0; height: auto; }
            .story-body { padding: 24px 20px 26px; gap: 18px; }
            .story-video { max-width: 200px; }

            .ba-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .ba-card { border-radius: 12px; }
            .ba-card-info { flex-direction: column; gap: 2px; padding: 12px 12px 14px; }
            .ba-card-highlight { font-size: 1rem; }
            .ba-card-who { text-align: left; font-size: 0.72rem; }
            .more-btn { width: 100%; }

            .quote-grid { grid-template-columns: 1fr; gap: 12px; }
            .quote-card { padding: 22px 20px; }

            .empty { grid-template-columns: 1fr; padding: 26px 22px; gap: 16px; }

            .urgent { padding-top: 32px; }
            .urgent-inner { padding: 22px 20px; }
            .urgent .btn { width: 100%; }

            .others { padding: 64px 0 88px; }
            .others-head { display: block; }
            .others-all { margin-top: 10px; }
            .others-track { margin: 20px -16px 0; padding: 0 16px 8px; scroll-padding-left: 16px; scrollbar-width: none; }
            .others-track::-webkit-scrollbar { display: none; }
            .other { flex-basis: 64%; }
        }
    </style>
</head>

    <script src="przemiany.js?v=20261007"></script>
    <script>
        (function () {
            var esc = BC.esc;
            var app = document.getElementById('app');
            var cat = BC.category(BC.param('k'));
            if (!cat) { BC.notFound(app, 'Nie znaleźliśmy tego celu'); return; }

            var area = BC.area(cat.area);
            var cases = BC.casesIn(cat.slug);
            var stories = cases.filter(BC.hasDescription);
            var photos = cases.filter(function (c) { return !BC.hasDescription(c) && c.before && c.after; });
            var quotes = cases.filter(function (c) { return !BC.hasDescription(c) && !c.after && c.quote; });
            var PHOTOS_VISIBLE = 6;

            document.title = cat.title + ' — przemiany | Body Creator Wrocław';
            var md = document.querySelector('meta[name="description"]');
            if (md) md.content = cat.title + ': ' + cat.tagline + ' Zobacz przemiany podopiecznych Body Creator we Wrocławiu.';

            // Ból i urazy opisujemy problemem, pozostałe obszary celem
            var firstLabel = cat.area === 'bol' ? 'Opis problemu' : 'Cel';

            function storyHTML(c) {
                // Bez zdjęć sam opis (cytat by go dublował)
                var media = (c.before && c.after) ? BC.sliderHTML(c, BC.altFor(c)) : '';
                var actions = Array.isArray(c.actions)
                    ? '<ul>' + c.actions.map(function (a) { return '<li><i class="fas fa-check" aria-hidden="true"></i><span>' + esc(a) + '</span></li>'; }).join('') + '</ul>'
                    : (c.actions ? '<p>' + esc(c.actions) + '</p>' : '');
                var meta = [BC.whoLine(c)].filter(Boolean).join('');
                return '<article class="story reveal' + (media ? '' : ' is-text') + '">' + media +
                    '<div class="story-body">' +
                        ((c.highlight || meta) ? '<div class="story-top">' +
                            (c.highlight ? '<span class="story-highlight">' + esc(c.highlight) + '</span>' : '') +
                            (meta ? '<span class="story-meta">' + esc(meta) + '</span>' : '') + '</div>' : '') +
                        (c.goal ? '<div class="story-block"><h3>' + firstLabel + '</h3><p>' + esc(c.goal) + '</p></div>' : '') +
                        (actions ? '<div class="story-block"><h3>Podjęte działania</h3>' + actions + '</div>' : '') +
                        (c.effects ? '<div class="story-block"><h3>Efekty współpracy</h3><p>' + esc(c.effects) + '</p></div>' : '') +
                        (c.video ? '<div class="story-video"><video src="' + esc(c.video) + '" preload="metadata" playsinline loop></video>' +
                            '<button class="video-play" type="button" aria-label="Odtwórz wideo"><span class="video-play-icon"><i class="fas fa-play"></i></span></button></div>' : '') +
                    '</div></article>';
            }

            function photoHTML(c, i) {
                // Podpis pod zdjęciem jest opcjonalny: pokazujemy tylko pola uzupełnione w panelu
                var who = BC.whoLine(c);
                var caption = (c.highlight || who)
                    ? '<figcaption class="ba-card-info">' +
                        (c.highlight ? '<span class="ba-card-highlight">' + esc(c.highlight) + '</span>' : '') +
                        (who ? '<span class="ba-card-who">' + esc(who) + '</span>' : '') +
                      '</figcaption>'
                    : '';
                return '<figure class="ba-card reveal"' + (i >= PHOTOS_VISIBLE ? ' hidden' : '') + '>' + BC.sliderHTML(c, BC.altFor(c)) + caption + '</figure>';
            }

            var resultsHTML;
            if (!cases.length) {
                resultsHTML = '<div class="empty reveal">' +
                    '<div class="empty-icon"><i class="fas fa-seedling"></i></div>' +
                    '<div><h2>Pierwsze historie w drodze</h2><p>Nasi podopieczni są właśnie w trakcie. Wkrótce pokażemy tu ich efekty.</p></div>' +
                    '</div>';
            } else {
                resultsHTML = stories.map(storyHTML).join('') +
                    (photos.length ? '<div class="ba-grid">' + photos.map(photoHTML).join('') + '</div>' +
                        (photos.length > PHOTOS_VISIBLE ? '<button class="btn btn-outline more-btn" type="button">Zobacz więcej przemian <i class="fas fa-arrow-down"></i></button>' : '') : '') +
                    (quotes.length ? '<div class="quote-grid">' + quotes.map(function (c) {
                        return '<figure class="quote-card reveal">' +
                            '<span class="quote-card-highlight">' + esc(c.highlight) + '</span>' +
                            '<blockquote>' + esc(c.quote) + '</blockquote>' +
                            '<footer><strong>' + esc([c.name, BC.age(c.age)].filter(Boolean).join(', ')) + '</strong><span>' + esc([c.condition, c.duration].filter(Boolean).join(' · ')) + '</span></footer>' +
                            '</figure>';
                    }).join('') + '</div>' : '');
            }

            /* Inne przemiany z tego samego obszaru: jedna karta na cel, przewijane w bok */
            var others = BC.categoriesIn(cat.area).filter(function (s) { return s !== cat; }).map(function (s) {
                var list = BC.casesIn(s.slug);
                if (!list.length) return '';
                var pic = list.find(function (c) { return c.after; });
                var top = pic
                    ? '<img src="' + esc(pic.after) + '" alt="' + esc(BC.altFor(pic)) + '" loading="lazy">'
                    : '<div class="other-quote">' + esc(list[0].highlight || s.title) + '</div>';
                return '<a class="other" href="' + BC.categoryUrl(s.slug) + '">' + top +
                    '<span class="other-body"><span class="other-title">' + esc(s.title) + '</span>' +
                    '<span class="other-link">Dostrzegasz swój problem? Kliknij <i class="fas fa-arrow-right"></i></span></span></a>';
            }).join('');

            app.innerHTML =
                '<section class="cat-hero"><div class="container">' +
                    '<nav class="crumbs" aria-label="Okruszki"><a href="przemiany.html">Przemiany</a><i class="fas fa-chevron-right" aria-hidden="true"></i>' +
                    '<a href="' + BC.areaUrl(area.id) + '">' + esc(area.name) + '</a><i class="fas fa-chevron-right" aria-hidden="true"></i>' +
                    '<span aria-current="page">' + esc(cat.title) + '</span></nav>' +
                    '<span class="section-label">' + esc(area.name) + '</span>' +
                    '<h1>' + esc(cat.title) + '</h1>' +
                '</div></section>' +

                '<section class="results" aria-label="Przemiany podopiecznych"><div class="container results-list">' + resultsHTML + '</div></section>' +

                '<section class="urgent"><div class="container"><div class="urgent-inner reveal">' +
                    '<p>Terminy współpracy szybko się zapełniają.<span>Nie zwlekaj, umów się już dziś. Pierwsza konsultacja jest bezpłatna.</span></p>' +
                    '<a class="btn btn-primary btn-sm" href="../rezerwacja.html">Umów konsultację <i class="fas fa-arrow-right"></i></a>' +
                '</div></div></section>' +

                '<section class="others"><div class="container">' +
                    '<div class="others-head"><div><span class="section-label">Zobacz też</span><h2>Inne przemiany</h2></div>' +
                    '<a class="others-all" href="' + BC.areaUrl(area.id) + '">Zobacz więcej <i class="fas fa-arrow-right"></i></a></div>' +
                    (others ? '<div class="others-track">' + others + '</div>' : '') +
                '</div></section>';

            app.querySelectorAll('.story-video').forEach(function (tile) {
                var v = tile.querySelector('video');
                tile.querySelector('.video-play').addEventListener('click', function () {
                    tile.classList.add('is-playing');
                    v.controls = true;
                    v.play();
                });
            });

            var more = app.querySelector('.more-btn');
            if (more) more.addEventListener('click', function () {
                app.querySelectorAll('.ba-card[hidden]').forEach(function (el) { el.hidden = false; el.classList.add('in'); });
                more.remove();
            });

            BC.initSliders(app);
            BC.initReveal(app);
        })();
    </script>

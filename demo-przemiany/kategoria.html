<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Przemiany | Body Creator Wrocław</title>
    <meta name="description" content="Przemiany podopiecznych Body Creator we Wrocławiu: zdjęcia przed i po, case study i opis tego, jak pracujemy.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#F5CA00">

    <link rel="icon" href="../favicon.ico?v=3" sizes="any">
    <link rel="icon" type="image/png" href="../favicon.png?v=3">
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=3">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="przemiany.css">

    <style>
        /* ============ HERO ============ */
        .cat-hero { padding: 160px 0 72px; }
        .cat-hero h1 {
            font-size: clamp(2rem, 5.4vw, 4rem);
            font-weight: 900;
            letter-spacing: 1.5px;
            line-height: 1.05;
            text-transform: uppercase;
            max-width: 16ch;
        }
        .cat-lead { margin-top: 22px; color: var(--gray-light); font-size: 1.08rem; line-height: 1.75; max-width: 56ch; }
        .cat-facts {
            display: flex;
            flex-wrap: wrap;
            margin-top: 40px;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }
        .cat-fact { padding: 18px 40px 18px 0; margin-right: 40px; border-right: 1px solid var(--line); }
        .cat-fact:last-child { border-right: 0; margin-right: 0; }
        .cat-fact dt { font-size: 0.68rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); }
        .cat-fact dd { font-size: 1.3rem; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
        .cat-hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; margin-top: 36px; }
        .text-link { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.9rem; color: var(--white); }
        .text-link i { color: var(--yellow); transition: transform var(--transition); }
        .text-link:hover i { transform: translateY(3px); }

        /* ============ APPROACH ============ */
        .approach { padding: 24px 0 96px; }
        .approach-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 72px; }
        .approach h2 { font-size: 1.05rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 22px; }
        .for-who { list-style: none; display: grid; gap: 14px; }
        .for-who li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; color: var(--gray-light); line-height: 1.6; }
        .for-who i { color: var(--yellow); margin-top: 5px; font-size: 0.85rem; }
        .steps { list-style: none; counter-reset: step; display: grid; gap: 0; }
        .steps li {
            counter-increment: step;
            position: relative;
            display: grid;
            grid-template-columns: 52px 1fr;
            gap: 18px;
            padding-bottom: 28px;
        }
        .steps li::before {
            content: counter(step, decimal-leading-zero);
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--dark-2);
            border: 1px solid var(--line);
            color: var(--yellow);
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .steps li:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 26px;
            top: 56px;
            bottom: 4px;
            width: 1px;
            background: var(--line);
        }
        .steps h3 { font-size: 1.08rem; font-weight: 700; margin: 4px 0 6px; }
        .steps p { color: var(--gray-light); font-size: 0.95rem; line-height: 1.65; }

        /* ============ RESULTS ============ */
        .results { padding: 0 0 40px; scroll-margin-top: 110px; }
        .results-head { margin-bottom: 40px; }

        /* Case study feature (duży blok) */
        .feature {
            display: grid;
            grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
            gap: 0;
            border-radius: 24px;
            overflow: hidden;
            background: var(--dark-2);
            border: 1px solid var(--line);
            margin-bottom: 24px;
        }
        .feature .ba-slider { aspect-ratio: auto; height: 100%; min-height: 460px; }
        .feature-quote-media {
            display: flex;
            align-items: center;
            padding: 48px 40px;
            background: var(--dark-3);
            font-size: 1.25rem;
            line-height: 1.6;
            color: var(--white);
        }
        .feature-quote-media p::before {
            content: '\201C';
            display: block;
            font-family: Georgia, serif;
            font-size: 5rem;
            line-height: 0.7;
            color: var(--yellow);
            margin-bottom: 10px;
        }
        .feature-body { padding: 44px 44px 40px; display: flex; flex-direction: column; }
        .feature-kicker { font-size: 0.68rem; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--yellow); }
        .feature-highlight { font-size: clamp(2.6rem, 5vw, 3.8rem); font-weight: 900; line-height: 1; letter-spacing: -1px; margin: 14px 0 10px; }
        .feature-title { font-size: 1.3rem; font-weight: 700; line-height: 1.35; max-width: 30ch; }
        .feature-who { color: var(--gray); font-size: 0.88rem; font-weight: 600; margin-top: 10px; }
        .metrics { width: 100%; border-collapse: collapse; margin: 28px 0 32px; font-variant-numeric: tabular-nums; }
        .metrics th, .metrics td { text-align: left; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
        .metrics thead th { font-size: 0.64rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); font-weight: 700; padding-top: 0; }
        .metrics tbody th { font-weight: 500; color: var(--gray-light); }
        .metrics td { font-weight: 700; }
        .metrics td.is-before { color: var(--gray); font-weight: 500; }
        .metrics td i { color: var(--gray-dark); font-size: 0.7rem; margin: 0 8px; }
        .feature .btn { align-self: flex-start; margin-top: auto; }

        /* Siatka zdjęć przed/po */
        .ba-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-top: 48px; align-items: start; }
        .ba-card { background: var(--dark-2); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
        .ba-card-info { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 16px 18px 18px; }
        .ba-card-highlight { font-size: 1.15rem; font-weight: 800; }
        .ba-card-who { font-size: 0.78rem; color: var(--gray); font-weight: 600; text-align: right; }

        /* Opinie bez zdjęć */
        .quote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 48px; }
        .quote-card {
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 28px;
            background: var(--dark-2);
            border: 1px solid var(--line);
            border-radius: 16px;
        }
        .quote-card-highlight { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.3px; }
        .quote-card blockquote { color: var(--gray-light); line-height: 1.75; font-size: 0.95rem; flex: 1; }
        .quote-card footer { padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.82rem; }
        .quote-card footer strong { display: block; font-weight: 700; }
        .quote-card footer span { color: var(--gray); }

        /* Pusty stan */
        .empty {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 28px;
            padding: 40px;
            border-radius: 24px;
            border: 1px dashed rgba(255,255,255,0.14);
        }
        .empty-icon { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--dark-2); color: var(--yellow); font-size: 1.4rem; }
        .empty h3 { font-size: 1.3rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .empty p { color: var(--gray-light); margin-top: 6px; max-width: 52ch; }

        /* ============ VIDEO ============ */
        .videos { padding: 72px 0 0; }
        .video-track { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 260px)); gap: 20px; margin-top: 32px; }
        .video-tile { position: relative; aspect-ratio: 9 / 16; border-radius: 18px; overflow: hidden; background: var(--dark-3); }
        .video-tile video { width: 100%; height: 100%; object-fit: cover; }
        .video-play {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px;
            border: 0;
            background: linear-gradient(180deg, rgba(10,10,10,0) 50%, rgba(10,10,10,0.85));
            color: var(--white);
            text-align: left;
            cursor: pointer;
        }
        .video-play-icon {
            align-self: center;
            margin-top: auto;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--yellow);
            color: var(--dark);
            font-size: 1.1rem;
            transition: transform var(--transition), box-shadow var(--transition);
        }
        .video-play:hover .video-play-icon { transform: scale(1.06); box-shadow: 0 10px 30px rgba(245,202,0,0.3); }
        .video-play-caption { margin-top: auto; font-weight: 700; font-size: 0.92rem; }
        .video-play-caption small { display: block; color: var(--gray-light); font-weight: 500; font-size: 0.78rem; }
        .video-tile.is-playing .video-play { display: none; }

        /* ============ SIBLINGS ============ */
        .siblings { padding: 96px 0 0; }
        .sibling-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            padding: 10px 18px;
            border-radius: 50px;
            background: var(--dark-2);
            border: 1px solid var(--line);
            font-size: 0.88rem;
            font-weight: 600;
            transition: border-color var(--transition), color var(--transition);
        }
        .chip:hover { border-color: var(--yellow); color: var(--yellow); }
        .chip small { color: var(--gray); font-weight: 600; font-size: 0.75rem; }
        .pager { display: grid; grid-template-columns: 1fr 1fr; margin-top: 48px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
        .pager a { display: flex; flex-direction: column; gap: 6px; padding: 26px 0; }
        .pager a + a { text-align: right; border-left: 1px solid var(--line); padding-left: 24px; }
        .pager small { font-size: 0.68rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); }
        .pager span { font-size: 1.1rem; font-weight: 700; transition: color var(--transition); }
        .pager a:hover span { color: var(--yellow); }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 1024px) {
            .approach-grid { grid-template-columns: 1fr; gap: 48px; }
            .feature { grid-template-columns: 1fr 1fr; }
            .feature-body { padding: 32px; }
        }

        @media (max-width: 768px) {
            .cat-hero { padding: 124px 0 48px; }
            .cat-lead { font-size: 0.98rem; }
            .cat-facts { margin-top: 28px; }
            .cat-facts { display: grid; grid-template-columns: 1.4fr 1fr 1fr; }
            .cat-fact { padding: 14px 10px 14px 12px; margin-right: 0; }
            .cat-fact:first-child { padding-left: 0; }
            .cat-fact dd { font-size: 1rem; }
            .cat-fact dt { font-size: 0.58rem; letter-spacing: 1.2px; }
            .cat-hero-actions .btn { width: 100%; }

            .approach { padding: 8px 0 64px; }

            .feature { grid-template-columns: 1fr; border-radius: 20px; }
            .feature .ba-slider { aspect-ratio: 5 / 6; min-height: 0; height: auto; }
            .feature-quote-media { padding: 32px 24px; font-size: 1.08rem; }
            .feature-body { padding: 26px 22px 24px; }
            .feature .btn { width: 100%; }

            .ba-grid { grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 32px; }
            .ba-card { border-radius: 12px; }
            .ba-card-info { flex-direction: column; gap: 2px; padding: 12px 12px 14px; }
            .ba-card-highlight { font-size: 1rem; }
            .ba-card-who { text-align: left; font-size: 0.72rem; }

            .quote-grid { grid-template-columns: 1fr; gap: 12px; margin-top: 32px; }
            .quote-card { padding: 22px 20px; }

            .empty { grid-template-columns: 1fr; padding: 28px 22px; gap: 18px; }
            .empty .btn { width: 100%; }

            .videos { padding-top: 56px; }
            .video-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin: 32px -16px 0; padding: 0 16px; gap: 12px; scrollbar-width: none; }
            .video-tile { flex: 0 0 62%; scroll-snap-align: start; scroll-margin-left: 16px; }

            .siblings { padding-top: 72px; }
            .pager span { font-size: 0.95rem; }
            .pager a + a { padding-left: 14px; }
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>

    <script src="przemiany.js"></script>
    <script>
        (function () {
            var esc = BC.esc;
            var app = document.getElementById('app');
            var cat = BC.category(BC.param('k'));
            if (!cat) { BC.notFound(app, 'Nie znaleźliśmy tego celu'); return; }

            var area = BC.area(cat.area);
            var cases = BC.casesIn(cat.slug);
            var stories = cases.filter(BC.isStory);
            var photos = cases.filter(function (c) { return !c.story && c.before && c.after; });
            var quotes = cases.filter(function (c) { return !c.story && !c.after && c.quote; });
            var videos = cases.filter(function (c) { return c.video; });

            document.title = cat.title + ' — przemiany | Body Creator Wrocław';
            var md = document.querySelector('meta[name="description"]');
            if (md) md.content = cat.title + ': ' + cat.tagline + ' Zobacz przemiany podopiecznych Body Creator we Wrocławiu.';

            function metricsTable(c) {
                if (!c.metrics || !c.metrics.length) return '';
                return '<table class="metrics"><thead><tr><th scope="col">Parametr</th><th scope="col">Start</th><th scope="col">Efekt</th></tr></thead><tbody>' +
                    c.metrics.slice(0, 3).map(function (m) {
                        return '<tr><th scope="row">' + esc(m.label) + '</th><td class="is-before">' + esc(m.before) + '</td><td>' + esc(m.after) + '</td></tr>';
                    }).join('') + '</tbody></table>';
            }

            function featureHTML(c) {
                var media = (c.before && c.after)
                    ? BC.sliderHTML(c, BC.altFor(c))
                    : '<div class="feature-quote-media"><p>' + esc(c.quote) + '</p></div>';
                return '<article class="feature reveal">' + media +
                    '<div class="feature-body">' +
                        '<span class="feature-kicker">Case study</span>' +
                        '<div class="feature-highlight">' + esc(c.highlight) + '</div>' +
                        '<h3 class="feature-title">' + esc(c.title) + '</h3>' +
                        '<p class="feature-who">' + esc([BC.whoLine(c), c.perWeek ? c.perWeek + '× w tygodniu' : ''].filter(Boolean).join(' · ')) + '</p>' +
                        metricsTable(c) +
                        '<a class="btn btn-primary" href="' + BC.caseUrl(c) + '">Czytaj całą historię <i class="fas fa-arrow-right"></i></a>' +
                    '</div></article>';
            }

            var resultsHTML;
            if (!cases.length) {
                resultsHTML = '<div class="empty reveal">' +
                    '<div class="empty-icon"><i class="fas fa-seedling"></i></div>' +
                    '<div><h3>Pierwsze historie w drodze</h3><p>Nasi podopieczni są właśnie w trakcie. Wkrótce pokażemy tu ich efekty. Twoja przemiana może być pierwsza.</p></div>' +
                    '<a class="btn btn-primary" href="../rezerwacja.html">Zacznij swoją <i class="fas fa-arrow-right"></i></a>' +
                    '</div>';
            } else {
                resultsHTML = stories.map(featureHTML).join('') +
                    (photos.length ? '<div class="ba-grid">' + photos.map(function (c) {
                        // Podpis pod zdjęciem jest opcjonalny: pokazujemy tylko pola uzupełnione w panelu
                        var who = BC.whoLine(c);
                        var caption = (c.highlight || who)
                            ? '<figcaption class="ba-card-info">' +
                                (c.highlight ? '<span class="ba-card-highlight">' + esc(c.highlight) + '</span>' : '') +
                                (who ? '<span class="ba-card-who">' + esc(who) + '</span>' : '') +
                              '</figcaption>'
                            : '';
                        return '<figure class="ba-card reveal">' + BC.sliderHTML(c, BC.altFor(c)) + caption + '</figure>';
                    }).join('') + '</div>' : '') +
                    (quotes.length ? '<div class="quote-grid">' + quotes.map(function (c) {
                        return '<figure class="quote-card reveal">' +
                            '<span class="quote-card-highlight">' + esc(c.highlight) + '</span>' +
                            '<blockquote>' + esc(c.quote) + '</blockquote>' +
                            '<footer><strong>' + esc([c.name, BC.age(c.age)].filter(Boolean).join(', ')) + '</strong><span>' + esc([c.condition, c.duration].filter(Boolean).join(' · ')) + '</span></footer>' +
                            '</figure>';
                    }).join('') + '</div>' : '');
            }

            var videosHTML = videos.length ? '<section class="videos"><div class="container">' +
                '<span class="section-label">Wideo</span><h2 class="h-section">Zobacz w ruchu</h2>' +
                '<div class="video-track">' + videos.map(function (c) {
                    return '<div class="video-tile">' +
                        '<video src="' + esc(c.video) + '" preload="metadata" playsinline muted loop></video>' +
                        '<button class="video-play" type="button" aria-label="Odtwórz wideo: ' + esc(c.name) + '">' +
                            '<span class="video-play-icon"><i class="fas fa-play"></i></span>' +
                            '<span class="video-play-caption">' + esc(c.name) + ' · ' + esc(c.highlight) + '<small>' + esc(c.duration) + '</small></span>' +
                        '</button></div>';
                }).join('') + '</div></div></section>' : '';

            var siblings = BC.categoriesIn(cat.area);
            var idx = siblings.indexOf(cat);
            var prev = siblings[(idx - 1 + siblings.length) % siblings.length];
            var next = siblings[(idx + 1) % siblings.length];

            app.innerHTML =
                '<section class="cat-hero"><div class="container">' +
                    '<nav class="crumbs" aria-label="Okruszki"><a href="przemiany.html">Przemiany</a><i class="fas fa-chevron-right" aria-hidden="true"></i>' +
                    '<a href="' + BC.areaUrl(area.id) + '">' + esc(area.name) + '</a><i class="fas fa-chevron-right" aria-hidden="true"></i>' +
                    '<span aria-current="page">' + esc(cat.title) + '</span></nav>' +
                    '<span class="section-label">' + esc(area.name) + '</span>' +
                    '<h1>' + esc(cat.title) + '</h1>' +
                    '<p class="cat-lead">' + esc(cat.lead) + '</p>' +
                    '<dl class="cat-facts">' +
                        '<div class="cat-fact"><dt>Typowy czas</dt><dd>' + esc(cat.typicalTime) + '</dd></div>' +
                        '<div class="cat-fact"><dt>Przemiany</dt><dd>' + cases.length + '</dd></div>' +
                        '<div class="cat-fact"><dt>Case study</dt><dd>' + stories.length + '</dd></div>' +
                    '</dl>' +
                    '<div class="cat-hero-actions">' +
                        '<a class="btn btn-primary" href="../rezerwacja.html">Umów darmową konsultację <i class="fas fa-arrow-right"></i></a>' +
                        (cases.length ? '<a class="text-link" href="#efekty">Zobacz efekty <i class="fas fa-arrow-down"></i></a>' : '') +
                    '</div>' +
                '</div></section>' +

                '<section class="approach"><div class="container approach-grid">' +
                    '<div class="reveal"><h2>Dla kogo</h2><ul class="for-who">' +
                        cat.forWho.map(function (t) { return '<li><i class="fas fa-check" aria-hidden="true"></i><span>' + esc(t) + '</span></li>'; }).join('') +
                    '</ul></div>' +
                    '<div class="reveal"><h2>Jak pracujemy</h2><ol class="steps">' +
                        cat.process.map(function (s) { return '<li><div><h3>' + esc(s.title) + '</h3><p>' + esc(s.text) + '</p></div></li>'; }).join('') +
                    '</ol></div>' +
                '</div></section>' +

                '<section class="results" id="efekty"><div class="container">' +
                    '<div class="results-head"><span class="section-label">Efekty</span><h2 class="h-section">Przemiany podopiecznych</h2></div>' +
                    resultsHTML +
                '</div></section>' +

                videosHTML +

                '<section class="siblings"><div class="container">' +
                    '<span class="section-label">Inne cele</span><h2 class="h-section">' + esc(area.name) + '</h2>' +
                    '<div class="sibling-chips">' + siblings.filter(function (s) { return s !== cat; }).map(function (s) {
                        var n = BC.casesIn(s.slug).length;
                        return '<a class="chip" href="' + BC.categoryUrl(s.slug) + '">' + esc(s.title) + (n ? ' <small>' + n + '</small>' : '') + '</a>';
                    }).join('') + '</div>' +
                    '<nav class="pager" aria-label="Sąsiednie cele">' +
                        '<a href="' + BC.categoryUrl(prev.slug) + '"><small><i class="fas fa-arrow-left"></i> Poprzedni</small><span>' + esc(prev.title) + '</span></a>' +
                        '<a href="' + BC.categoryUrl(next.slug) + '"><small>Następny <i class="fas fa-arrow-right"></i></small><span>' + esc(next.title) + '</span></a>' +
                    '</nav>' +
                '</div></section>' +

                '<section class="cta-band"><div class="container"><div class="cta-band-inner reveal">' +
                    '<div><span class="section-label">Twój cel: ' + esc(cat.title.toLowerCase()) + '</span>' +
                    '<h2>Zacznijmy od rozmowy</h2>' +
                    '<p>Bezpłatna konsultacja: pomiary, wywiad i plan pierwszych tygodni. Bez zobowiązań.</p></div>' +
                    '<div class="cta-band-actions"><a href="../rezerwacja.html" class="btn btn-primary">Umów konsultację <i class="fas fa-arrow-right"></i></a>' +
                    '<a href="tel:518167945" class="cta-band-phone"><i class="fas fa-phone"></i> 518 167 945</a></div>' +
                '</div></div></section>';

            app.querySelectorAll('.video-tile').forEach(function (tile) {
                var v = tile.querySelector('video');
                tile.querySelector('.video-play').addEventListener('click', function () {
                    tile.classList.add('is-playing');
                    v.controls = true;
                    v.play();
                });
            });

            var jump = app.querySelector('a[href="#efekty"]');
            if (jump) jump.addEventListener('click', function (e) {
                if (!BC.lenis) return;
                e.preventDefault();
                BC.lenis.scrollTo('#efekty', { offset: -100 });
            });

            BC.initSliders(app);
            BC.initReveal(app);
        })();
    </script>
    <script src="bg-rotator.js" defer></script>
</body>
</html>
